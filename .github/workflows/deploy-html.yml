name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/elevated-home-resets-brand-wwe2vy, main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # /resources/[slug] and /transformations/[slug] have no published
      # entries yet (their content arrays are intentionally empty), so
      # generateStaticParams() returns []. `output: "export"` requires at
      # least one static param per dynamic route, since there's no server
      # left to resolve unknown slugs at request time — the build fails
      # otherwise. Nothing currently links to these routes (no resource or
      # transformation exists to link to), so excluding them from THIS
      # runner's checkout only is safe: this never touches the committed
      # source tree, only this ephemeral build. Delete this step once real
      # resource/transformation content ships and these routes generate
      # real params again.
      - name: Exclude dynamic routes with zero static params
        run: rm -rf "app/resources/[slug]" "app/transformations/[slug]"

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BOOKING_API_BASE: "https://hello-world.elevatedhome.workers.dev"
        run: npm run build

      - name: Verify static output
        run: |
          test -d out || (echo "Static export did not produce an out/ directory" && exit 1)
          test -f out/index.html || (echo "out/index.html is missing" && exit 1)

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
