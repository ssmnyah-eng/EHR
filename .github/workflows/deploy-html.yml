name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/elevated-home-resets-brand-wwe2vy, main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # /resources/[slug] still has no published entries (its content
      # array is intentionally empty), so generateStaticParams() returns
      # []. `output: "export"` requires at least one static param per
      # dynamic route, since there's no server left to resolve unknown
      # slugs at request time — the build fails otherwise. Excluding it
      # from THIS runner's checkout only is safe: this never touches the
      # committed source tree, only this ephemeral build. Delete this step
      # once real resource content ships and the route generates real
      # params again.
      #
      # /transformations/[slug] is NOT excluded here anymore — its
      # content array now has real published projects with real slugs, so
      # generateStaticParams() returns real params and the route builds
      # real pages. Excluding it used to silently 404 every "See Project"
      # link across the site (transformations hub cards, cleaning tier
      # pages) once that content shipped, because this step kept deleting
      # the route after the reason for excluding it no longer applied.
      - name: Exclude dynamic routes with zero static params
        run: rm -rf "app/resources/[slug]"

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BOOKING_API_BASE: "https://hello-world.elevatedhome.workers.dev"
        run: npm run build

      - name: Verify static output
        run: |
          test -d out || (echo "Static export did not produce an out/ directory" && exit 1)
          test -f out/index.html || (echo "out/index.html is missing" && exit 1)

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
