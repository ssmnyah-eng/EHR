name: Deploy to GitHub Pages

on:
  push:
    # This repo's only branch right now is claude/elevated-home-resets-brand-wwe2vy.
    # Update this to "main" if/when you create and switch to a main branch.
    branches: [claude/elevated-home-resets-brand-wwe2vy]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Project Pages (https://<user>.github.io/<repo>/) need a basePath,
      # a custom domain (CNAME file below) needs an empty one. Adjust or
      # remove NEXT_PUBLIC_BASE_PATH once a custom domain is attached.
      - run: npm run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /EHR
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
